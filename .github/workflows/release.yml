name: Caocode Windows installer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib packages test tool
      - name: Test release and Codex behavior
        run: flutter test test/update test/workspace/about_dialog_test.dart test/chat/codex_choices_test.dart test/kernel/codex_test.dart test/kernel/cc_switch_providers_test.dart
      - name: Build installer
        shell: pwsh
        run: |
          $sdk = Split-Path (Split-Path (Get-Command flutter).Source -Parent) -Parent
          ./tool/caocode/build-windows.ps1 -FlutterSdk $sdk -Installer
      - uses: actions/upload-artifact@v4
        with:
          name: Caocode-windows-x64-installer
          path: build/installers/Caocode-*-setup.exe
          if-no-files-found: error
