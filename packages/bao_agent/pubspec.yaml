name: bao_agent
description: >-
  Caocode's own coding agent, written in Dart: a session speaks the same
  stream-json protocol as `claude -p --input-format stream-json`, keeps its
  conversation where and as Claude Code keeps its own, and reads the same
  settings, CLAUDE.md, skills, subagents, commands, hooks, plugins and MCP
  servers. No Flutter in the library, so that it also runs headless.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.4

dependencies:
  crypto: ^3.0.6
  html: ^0.15.0
  path: ^1.9.1
  yaml: ^3.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
